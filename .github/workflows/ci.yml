name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: |
          python -m envwitness capture --output /tmp/receipt.json
          python -m envwitness compare /tmp/receipt.json /tmp/receipt.json
