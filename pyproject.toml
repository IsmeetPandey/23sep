[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envwitness"
version = "0.1.0"
description = "Privacy-safe runtime receipts and environment drift comparison"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ismeet Pandey"}]

[project.scripts]
envwitness = "envwitness.__main__:main"

[tool.setuptools.packages.find]
include = ["envwitness*"]
